  <script>
  // Synchronous dark mode initialization - runs before paint to prevent FOUC
  (function() {
      var stored = localStorage.getItem('splitsmart_theme_mode');
      var theme = stored || 'dark'; // default dark
      if (theme === 'system') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      if (!stored) {
          localStorage.setItem('splitsmart_theme_mode', 'dark');
      }
  })();
  </script>
